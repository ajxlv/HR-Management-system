<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WRS Energy · HR Dashboard</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/hr.css">
</head>
<body>
  <section id="gate" class="gate" hidden>
    <img src="/logo.png" class="logo-xl" alt="WRS Energy"><div class="brand">HR Dashboard</div>
    <h1>HR key</h1>
    <input id="key" type="password" autocomplete="current-password" aria-label="HR key">
    <button id="go" class="btn">OPEN</button>
    <p id="gateMsg" class="err"></p>
  </section>

  <main id="main" hidden>
    <header>
      <div class="brand"><img src="/logo.png" class="logo-sm" alt="WRS Energy"><span>Cleaning visits</span></div>
      <a id="xlsx" class="btn ghost" hidden>Download Excel</a>
    </header>

    <div class="stats" id="stats"></div>

    <div class="filters">
      <select id="fClient" aria-label="Client"></select>
      <select id="fStatus" aria-label="Status">
        <option value="">All visits</option>
        <option value="incomplete">Missing photos</option>
        <option value="off">Any item OFF</option>
        <option value="notCompleted">Not completed</option>
        <option value="defects">Defects reported</option>
        <option value="clientSign">No client signature</option>
        <option value="amc">AMC ending / ended</option>
        <option value="flags">Needs a check</option>
        <option value="ok">All good</option>
      </select>
      <span id="count" class="count"></span>
    </div>

    <div id="list" class="list"></div>
  </main>

  <div id="lightbox" class="lightbox" hidden><img alt=""><button aria-label="Close">×</button></div>
  <script src="/hr.js" type="module"></script>
</body>
</html>
