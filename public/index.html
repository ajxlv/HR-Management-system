<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>WRS Energy · Cleaning Photos</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="login" hidden>
    <img src="/logo.png" class="logo-xl" alt="WRS Energy">
    <h1>Enter your PIN</h1>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="PIN">
    <button id="pinGo" class="primary">OPEN</button>
    <p id="pinMsg" class="msg" role="alert"></p>
  </section>

  <main id="app" hidden>
    <header class="hero">
      <img src="/logo.png" class="logo-sm" alt="WRS Energy">
      <div class="who" id="who"></div>
    </header>
    <div id="waiting" class="waiting" hidden></div>
    <div id="missing" class="missing" hidden role="alert"></div>

    <section class="card" data-id="client">
      <h2><span class="n">1</span>Client</h2>
      <select id="client" aria-label="Client"></select>
    </section>

    <section class="card">
      <h2><span class="n">2</span>Date of work</h2>
      <input id="date" type="date" aria-label="Date of work">
    </section>

    <section class="card">
      <h2><span class="n">3</span>Photos</h2>
      <p class="hint" id="photoHint">Choose the client to see the photo boxes.</p>
      <div id="photoGroups"></div>
    </section>

    <section class="card">
      <h2><span class="n">4</span>Checklist</h2>
      <div id="checklist"></div>
    </section>

    <section class="card" data-id="overall">
      <h2><span class="n">5</span>Overall status</h2>
      <div id="overall" class="chips3"></div>
    </section>

    <section class="card" data-id="defects">
      <h2><span class="n">6</span>Any defects?</h2>
      <div class="yn">
        <button id="no" class="no" type="button">NO</button>
        <button id="yes" class="yes" type="button">YES</button>
      </div>
      <textarea id="details" rows="3" placeholder="Write the problem here (if any)"></textarea>
    </section>

    <section class="card" data-id="sig">
      <h2><span class="n">7</span>Client signature</h2>
      <div class="sigwrap">
        <canvas id="sigpad" aria-label="Client signature, draw with your finger"></canvas>
        <div class="sigcorner" id="sigcorner"></div>
        <div class="sigempty" id="sigempty">Client signs here</div>
      </div>
      <div class="sigbar"><span id="sigstamp" class="sigstamp"></span><button id="sigclear" class="ghost small" type="button" hidden>Clear and sign again</button></div>
      <div id="amc" class="amc" hidden></div>
      <label class="signa"><input id="signa" type="checkbox"> Client is not available to sign</label>
      <div id="sigreasonwrap" hidden><input id="sigreason" type="text" maxlength="200" placeholder="Why could the client not sign?" aria-label="Why the client could not sign"></div>
    </section>

    <p id="msg" class="msg" role="alert"></p>
    <button id="submit" class="primary">SUBMIT</button>
    <p id="ver" class="ver"></p>
  </main>

  <div id="viewer" class="viewer" hidden role="dialog" aria-label="Photo">
    <button class="vclose" id="vclose" aria-label="Close">×</button>
    <img id="vimg" alt="Photo">
    <div class="vcap" id="vcap"></div>
  </div>

  <script src="/queue-core.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
